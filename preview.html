<!doctype html>
<!-- Local preview of the generated sheets. Not part of the profile. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>profile · sheet preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #05070f; color: #eaf1ff;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 24px 8px; }
  h1 { font-size: 18px; letter-spacing: .02em; margin: 0 0 4px; }
  p.sub { margin: 0; color: #93a6c4; font-size: 13px; }
  nav { padding: 12px 24px; display: flex; gap: 8px; flex-wrap: wrap; }
  nav button { background: #0b1220; color: #cfe0ff; border: 1px solid #1b2740; border-radius: 999px;
               padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  nav button[aria-pressed="true"] { border-color: #4de1ff; color: #4de1ff; }
  main { padding: 8px 24px 80px; }
  figure { margin: 0 0 28px; }
  figcaption { color: #5b6e8e; font: 11px ui-monospace, Menlo, monospace; letter-spacing: .08em;
               text-transform: uppercase; margin: 0 0 8px; }
  img { width: 100%; height: auto; display: block; border-radius: 14px; }
  body.light { background: #f4f7fd; color: #0b1326; }
  body.light p.sub, body.light figcaption { color: #41516f; }
  body.light nav button { background: #fff; color: #24314d; border-color: #d6e0f0; }
  body.light nav button[aria-pressed="true"] { border-color: #0a7e9e; color: #0a7e9e; }
</style>
</head>
<body>
<header>
  <h1>Sheet preview</h1>
  <p class="sub">Every image is generated by <code>art/*.py</code> and <code>.github/scripts/*.py</code>. Regenerate with <code>python3 art/build_all.py</code>.</p>
</header>
<nav>
  <button data-theme="dark" aria-pressed="true">aurora</button>
  <button data-theme="light" aria-pressed="false">daylight</button>
</nav>
<main id="sheets"></main>
<script>
  const sheets = [
    ["art-header", "identity plate"],
    ["art-pulse", "heartbeat wheel"],
    ["ledger", "commit ledger"],
    ["state", "facts sheet"],
    ["live", "live probes"],
    ["postcard", "postcard wall"],
  ];
  const modeOf = { "art-header": "art", "art-pulse": "art", "art-divider": "art" };
  const main = document.getElementById("sheets");
  function render(theme) {
    main.innerHTML = sheets.map(([name, label]) =>
      `<figure><figcaption>${label} · ${theme}</figcaption>` +
      `<img src="./assets/${name}-${theme}.svg?t=${theme}" alt="${label}"></figure>`).join("");
    document.body.classList.toggle("light", theme === "light");
  }
  document.querySelectorAll("nav button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      render(btn.dataset.theme);
    });
  });
  render("dark");
</script>
</body>
</html>
