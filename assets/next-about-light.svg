<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="480" viewBox="0 0 1180 480" role="img">
<title>Manashjyoti Bora — profile artwork</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f7f9ff"/>
  <stop offset="1" stop-color="#eef3fd"/>
</linearGradient>
<radialGradient id="glowA" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#0f62e6" stop-opacity="0.16"/>
  <stop offset="1" stop-color="#0f62e6" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowB" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#d81f3a" stop-opacity="0.128"/>
  <stop offset="1" stop-color="#d81f3a" stop-opacity="0"/>
</radialGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#0f62e6" stop-opacity="0"/>
  <stop offset=".25" stop-color="#0f62e6" stop-opacity=".9"/>
  <stop offset=".72" stop-color="#d81f3a" stop-opacity=".9"/>
  <stop offset="1" stop-color="#d81f3a" stop-opacity="0"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#070b16"/>
  <stop offset=".55" stop-color="#070b16"/>
  <stop offset="1" stop-color="#247bff"/>
</linearGradient>
<linearGradient id="crimGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#d81f3a"/>
  <stop offset="1" stop-color="#0f62e6"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="1.4" cy="1.4" r="1.3" fill="#5a6b8c" opacity="0.16"/>
</pattern>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
  <path d="M22 0H0V22" fill="none" stroke="#070b16" stroke-opacity="0.07" stroke-width=".8"/>
</pattern>
<clipPath id="aclip"><rect x="0" y="0" width="1180" height="480" rx="28"/></clipPath>
</defs>
<style>
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.e{opacity:0;animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}
.b1{animation-delay:.06s}.b2{animation-delay:.16s}.b3{animation-delay:.26s}
.b4{animation-delay:.36s}.b5{animation-delay:.46s}.b6{animation-delay:.56s}
.b7{animation-delay:.68s}.b8{animation-delay:.80s}.b9{animation-delay:.92s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes faded{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,48%{opacity:1}50%,100%{opacity:0}}
@keyframes roles{0%{opacity:0;transform:translateY(7px)}3%{opacity:1;transform:none}22%{opacity:1;transform:none}25%{opacity:0;transform:translateY(-7px)}100%{opacity:0}}
@keyframes slide{0%{opacity:0;transform:translateY(10px)}3%{opacity:1;transform:none}30%{opacity:1;transform:none}33.3%{opacity:0;transform:translateY(-9px)}100%{opacity:0}}
@keyframes barA{0%{transform:scaleX(0)}33%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes barB{0%{transform:scaleX(0)}33%{transform:scaleX(0)}66%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes barC{0%{transform:scaleX(0)}66%{transform:scaleX(0)}99%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes dashes{to{stroke-dashoffset:-420}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
@keyframes sway{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
@keyframes foil{0%{transform:translateX(-160px)}55%,100%{transform:translateX(520px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.barA{transform-box:fill-box;transform-origin:left center;animation:barA 12s linear infinite}
.barB{transform-box:fill-box;transform-origin:left center;animation:barB 12s linear infinite}
.barC{transform-box:fill-box;transform-origin:left center;animation:barC 12s linear infinite}
.slide{opacity:0;animation:slide 12s linear infinite}
.role{opacity:0;animation:roles 12s linear infinite}
.dash{animation:dashes 26s linear infinite}
.dash.fast{animation-duration:17s;animation-direction:reverse}
.fl{animation:float 7s ease-in-out infinite}
.fl.f2{animation-delay:-2.2s}.fl.f3{animation-delay:-4.1s}.fl.f4{animation-delay:-5.6s}
.dotp{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.swing{transform-origin:380px 118px;animation:sway 7.5s ease-in-out infinite}
.foil{animation:foil 7s ease-in-out infinite}
.arrow{animation:nudge 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
      .e,.slide,.role,.dash,.fl,.dotp,.swing,.foil,.arrow{animation:none!important}
  .e,.slide,.role{opacity:1!important;transform:none!important}
  .barA,.barB,.barC{animation:none!important;transform:scaleX(1)}
}
</style>
<rect width="1180" height="480" rx="28" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1179" height="479" rx="27.5" fill="none" stroke="#070b16" stroke-opacity="0.16"/>

<g clip-path="url(#aclip)">
  <rect width="1180" height="480" fill="url(#dots)" opacity=".5"/>
  <ellipse cx="1120" cy="470" rx="420" ry="300" fill="url(#glowA)" opacity=".55"/>
</g>
<text x="64" y="72" font-size="11" fill="#0f62e6" font-weight="700" letter-spacing="2.6" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace" class="e b1">01 / THE OPERATOR</text><text x="1116" y="72" font-size="10.5" fill="#5a6b8c" font-weight="500" text-anchor="end" letter-spacing="2.2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace" class="e b1">WHAT I ACTUALLY DO</text><line x1="64" y1="92" x2="1116" y2="92" stroke="#070b16" stroke-opacity="0.12" stroke-width="1"/>

<g class="e b2"><text x="64" y="166" font-size="44" fill="#070b16" font-weight="800" letter-spacing="-1.4">One phone.</text></g>
<g class="e b3"><text x="64" y="214" font-size="44" fill="url(#nameGrad)" font-weight="800" letter-spacing="-1.4">Two production apps.</text></g>
<g class="e b4"><text x="64" y="252" font-size="12.5" fill="#5a6b8c" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">The laptop was never the point. The constraint became the brand.</text></g>

<line x1="64" y1="292" x2="636" y2="292" stroke="#070b16" stroke-opacity="0.08" stroke-width="1"/><text x="64" y="316" font-size="10.5" fill="#0f62e6" font-weight="700" letter-spacing="1.8" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">01</text><text x="112" y="316" font-size="14.5" fill="#070b16" font-weight="700" letter-spacing="1.1">FRONTEND SYSTEMS</text><text x="112" y="335" font-size="11.5" fill="#5a6b8c" letter-spacing="0.2">React 19 · Next.js · Vite · responsive UI</text><line x1="64" y1="348" x2="636" y2="348" stroke="#070b16" stroke-opacity="0.08" stroke-width="1"/><text x="64" y="372" font-size="10.5" fill="#0f62e6" font-weight="700" letter-spacing="1.8" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">02</text><text x="112" y="372" font-size="14.5" fill="#070b16" font-weight="700" letter-spacing="1.1">BACKEND &amp; DATA</text><text x="112" y="391" font-size="11.5" fill="#5a6b8c" letter-spacing="0.2">Node · REST · JWT · Zod · MongoDB Atlas</text><line x1="64" y1="404" x2="636" y2="404" stroke="#070b16" stroke-opacity="0.08" stroke-width="1"/><text x="64" y="428" font-size="10.5" fill="#0f62e6" font-weight="700" letter-spacing="1.8" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">03</text><text x="112" y="428" font-size="14.5" fill="#070b16" font-weight="700" letter-spacing="1.1">CRAFT &amp; OPS</text><text x="112" y="447" font-size="11.5" fill="#5a6b8c" letter-spacing="0.2">Hand-typed SVG/SMIL · GitHub Actions · Vercel</text>

<g class="e b3">
  <rect x="676" y="104" width="440" height="330" rx="22" fill="#ffffff" stroke="#070b16" stroke-opacity="0.15"/>
  <rect x="676" y="104" width="440" height="330" rx="22" fill="url(#grid)" opacity=".5"/>
  <path d="M676 104H760" stroke="url(#hair)" stroke-width="2"/>
</g>

<g class="slide" style="animation-delay:0s"><text x="1010" y="214" font-size="92" fill="#070b16" font-weight="800" text-anchor="end" letter-spacing="-2" opacity="0.055">01</text><text x="712" y="152" font-size="9.5" fill="#0f62e6" font-weight="700" letter-spacing="2.4" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">CRAFT / 01</text><text x="712" y="202" font-size="27" fill="#070b16" font-weight="800" letter-spacing="-0.6">Zero-JS</text><text x="712" y="234" font-size="27" fill="#070b16" font-weight="800" letter-spacing="-0.6">animation.</text><text x="712" y="268" font-size="11.5" fill="#24314a">Fourteen SVG files, hand-typed.</text><text x="712" y="286" font-size="11.5" fill="#5a6b8c">CSS + SMIL only — GitHub renders</text><text x="712" y="304" font-size="11.5" fill="#5a6b8c">every frame, no libraries.</text></g><g class="slide" style="animation-delay:4s"><text x="1010" y="214" font-size="92" fill="#070b16" font-weight="800" text-anchor="end" letter-spacing="-2" opacity="0.055">02</text><text x="712" y="152" font-size="9.5" fill="#0f62e6" font-weight="700" letter-spacing="2.4" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">SHIP / 02</text><text x="712" y="202" font-size="27" fill="#070b16" font-weight="800" letter-spacing="-0.6">Production,</text><text x="712" y="234" font-size="27" fill="#070b16" font-weight="800" letter-spacing="-0.6">from a phone.</text><text x="712" y="268" font-size="11.5" fill="#24314a">Termux → GitHub → Vercel.</text><text x="712" y="286" font-size="11.5" fill="#5a6b8c">Auth, cart and checkout are live</text><text x="712" y="304" font-size="11.5" fill="#5a6b8c">in the wild right now.</text></g><g class="slide" style="animation-delay:8s"><text x="1010" y="214" font-size="92" fill="#070b16" font-weight="800" text-anchor="end" letter-spacing="-2" opacity="0.055">03</text><text x="712" y="152" font-size="9.5" fill="#0f62e6" font-weight="700" letter-spacing="2.4" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">HABIT / 03</text><text x="712" y="202" font-size="27" fill="#070b16" font-weight="800" letter-spacing="-0.6">Seven robots</text><text x="712" y="234" font-size="27" fill="#070b16" font-weight="800" letter-spacing="-0.6">work here.</text><text x="712" y="268" font-size="11.5" fill="#24314a">Daily snapshot, telemetry, sheets,</text><text x="712" y="286" font-size="11.5" fill="#5a6b8c">snake, Pac-Man, 3D city, signatures.</text><text x="712" y="304" font-size="11.5" fill="#5a6b8c">All conflict-safe, all automatic.</text></g>

<g class="e b6">
  <line x1="712" y1="340" x2="1080" y2="340" stroke="#070b16" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="712" y="366" width="118" height="3" rx="1.5" fill="#070b16" fill-opacity="0.1"/>
  <rect x="840" y="366" width="118" height="3" rx="1.5" fill="#070b16" fill-opacity="0.1"/>
  <rect x="968" y="366" width="118" height="3" rx="1.5" fill="#070b16" fill-opacity="0.1"/>
  <rect x="712" y="366" width="118" height="3" rx="1.5" fill="#0f62e6" class="barA"/>
  <rect x="840" y="366" width="118" height="3" rx="1.5" fill="#0f62e6" class="barB"/>
  <rect x="968" y="366" width="118" height="3" rx="1.5" fill="#0f62e6" class="barC"/>
  <text x="712" y="400" font-size="8.5" fill="#5a6b8c" font-weight="600" letter-spacing="2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">AUTOPLAY · 4S PER SLIDE · CSS ONLY</text>
  <text x="1080" y="400" font-size="8.5" fill="#5a6b8c" font-weight="600" text-anchor="end" letter-spacing="2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">01 — 03</text>
</g>

<g class="e b8">
  <text x="676" y="462" font-size="8.5" fill="#5a6b8c" font-weight="600" letter-spacing="2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">ANDROID-BUILT · ZERO JS</text>
  <text x="1116" y="462" font-size="8.5" fill="#5a6b8c" font-weight="600" text-anchor="end" letter-spacing="2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">BUILD_NEXT.PY</text>
</g>

</svg>
