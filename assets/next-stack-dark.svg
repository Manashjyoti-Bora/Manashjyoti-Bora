<g class="e b2"><text x="64" y="178" font-size="38" fill="#f4f7ff" font-weight="800" letter-spacing="-1.2">Tools are</text></g>
<g class="e b2"><text x="64" y="220" font-size="38" fill="url(#nameGrad)" font-weight="800" letter-spacing="-1.2">borrowed.</text></g>
<g class="e b3"><text x="64" y="258" font-size="38" fill="#f4f7ff" font-weight="800" letter-spacing="-1.2">Habits compound.</text></g>
<g class="e b4"><text x="64" y="296" font-size="11.5" fill="#8b9dc2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">No bootcamp. No laptop. Six months</text></g>
<g class="e b4"><text x="64" y="314" font-size="11.5" fill="#8b9dc2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">of shipping, one commit at a time.</text></g>

<circle cx="720" cy="250" r="120" fill="url(#glowB)" opacity=".7"/>
<ellipse class="dash" cx="720" cy="250" rx="150" ry="64" transform="rotate(-24 720 250)" fill="none" stroke="#247bff" stroke-opacity="0.4" stroke-width="1.1" stroke-dasharray="3 8"/><ellipse class="dash fast" cx="720" cy="250" rx="212" ry="88" transform="rotate(16 720 250)" fill="none" stroke="#ff354f" stroke-opacity="0.32" stroke-width="1.1" stroke-dasharray="12 10"/><ellipse class="dash" cx="720" cy="250" rx="290" ry="118" transform="rotate(0 720 250)" fill="none" stroke="#8b9dc2" stroke-opacity="0.24" stroke-width="1.1" stroke-dasharray="2 9"/>
<g class="e b4">
  <rect x="662" y="192" width="116" height="116" rx="34" fill="#0b1220" stroke="url(#hair)" stroke-width="1.3"/>
  <text x="720" y="246" font-size="34" fill="#f4f7ff" font-weight="800" text-anchor="middle" letter-spacing="-1">MB</text>
  <text x="720" y="272" font-size="8" fill="#8b9dc2" font-weight="600" text-anchor="middle" letter-spacing="2.2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">CORE</text>
  <circle cx="720" cy="192" r="3.2" fill="#247bff"/>
</g>
<g class="e b6"><rect x="967.0" y="238.0" width="86" height="24" rx="12" fill="#0b1220" stroke="#247bff" stroke-width="1" stroke-opacity=".45"/><text x="1010.0" y="254.0" font-size="10.5" fill="#c9d6ec" font-weight="600" text-anchor="middle" letter-spacing="0.4">NODE.JS</text></g><g class="e b6"><rect x="895.1528885045036" y="313.8489379430116" width="94" height="24" rx="12" fill="#0b1220" stroke="#ff354f" stroke-width="1" stroke-opacity=".45"/><text x="942.1528885045036" y="329.8489379430116" font-size="10.5" fill="#c9d6ec" font-weight="600" text-anchor="middle" letter-spacing="0.4">MONGODB</text></g><g class="e b6"><rect x="661.0" y="356.0" width="118" height="24" rx="12" fill="#0b1220" stroke="#34e5a1" stroke-width="1" stroke-opacity=".45"/><text x="720.0" y="372.0" font-size="10.5" fill="#c9d6ec" font-weight="600" text-anchor="middle" letter-spacing="0.4">GITHUB ACTIONS</text></g><g class="e b6"><rect x="460.8471114954964" y="313.84893794301166" width="74" height="24" rx="12" fill="#0b1220" stroke="#247bff" stroke-width="1" stroke-opacity=".45"/><text x="497.8471114954964" y="329.84893794301166" font-size="10.5" fill="#c9d6ec" font-weight="600" text-anchor="middle" letter-spacing="0.4">REACT</text></g><g class="e b6"><rect x="454.8471114954964" y="162.15106205698837" width="86" height="24" rx="12" fill="#0b1220" stroke="#247bff" stroke-width="1" stroke-opacity=".45"/><text x="497.8471114954964" y="178.15106205698837" font-size="10.5" fill="#c9d6ec" font-weight="600" text-anchor="middle" letter-spacing="0.4">NEXT.JS</text></g><g class="e b6"><rect x="667.0" y="120.0" width="106" height="24" rx="12" fill="#0b1220" stroke="#ff354f" stroke-width="1" stroke-opacity=".45"/><text x="720.0" y="136.0" font-size="10.5" fill="#c9d6ec" font-weight="600" text-anchor="middle" letter-spacing="0.4">TYPESCRIPT</text></g><g class="e b6"><rect x="903.1528885045036" y="162.15106205698834" width="78" height="24" rx="12" fill="#0b1220" stroke="#34e5a1" stroke-width="1" stroke-opacity=".45"/><text x="942.1528885045036" y="178.15106205698834" font-size="10.5" fill="#c9d6ec" font-weight="600" text-anchor="middle" letter-spacing="0.4">PYTHON</text></g>
<rect x="64" y="392" width="332" height="92" rx="18" fill="#0b1220" stroke="#f4f7ff" stroke-width="1" stroke-opacity="0.1"/><rect x="64" y="392" width="44" height="3" rx="1.5" fill="#247bff"/><text x="88" y="424" font-size="9.5" fill="#247bff" font-weight="700" letter-spacing="2.2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">FRONTEND</text><text x="88" y="448" font-size="10.2" fill="#c9d6ec" font-weight="500" letter-spacing="0.1" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">HTML · CSS · JS · React · Next.js · Tailwind · Vite</text><rect x="424" y="392" width="332" height="92" rx="18" fill="#0b1220" stroke="#f4f7ff" stroke-width="1" stroke-opacity="0.1"/><rect x="424" y="392" width="44" height="3" rx="1.5" fill="#ff354f"/><text x="448" y="424" font-size="9.5" fill="#ff354f" font-weight="700" letter-spacing="2.2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">BACKEND &amp; DATA</text><text x="448" y="448" font-size="10.2" fill="#c9d6ec" font-weight="500" letter-spacing="0.1" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">Node · Express · REST · JWT · Zod · MongoDB</text><rect x="784" y="392" width="332" height="92" rx="18" fill="#0b1220" stroke="#f4f7ff" stroke-width="1" stroke-opacity="0.1"/><rect x="784" y="392" width="44" height="3" rx="1.5" fill="#34e5a1"/><text x="808" y="424" font-size="9.5" fill="#34e5a1" font-weight="700" letter-spacing="2.2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">CRAFT &amp; OPS</text><text x="808" y="448" font-size="10.2" fill="#c9d6ec" font-weight="500" letter-spacing="0.1" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">SVG + SMIL · Actions · Git · Linux · Vercel · npm</text>

