idth="1.5"/><path d="M622 247H642M632 237C640 245 640 249 632 257M632 237C624 245 624 249 632 257" fill="none" stroke="#247bff" stroke-width="1.2" opacity=".8"/><text x="656" y="244" font-size="9.5" fill="#0f62e6" font-weight="700" letter-spacing="2.2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">PORTFOLIO</text><text x="656" y="265" font-size="10.5" fill="#24314a" font-weight="500" letter-spacing="0.1" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">portfolio-manashjyoti-bora</text><g class="arrow"><text x="820" y="256" font-size="15" fill="#5a6b8c" text-anchor="middle">→</text></g></g><g class="e b5"><rect x="860" y="210" width="246" height="78" rx="16" fill="#ffffff" stroke="#070b16" stroke-width="1" stroke-opacity="0.12"/><rect x="881" y="240" width="22" height="16" rx="3" fill="none" stroke="#247bff" stroke-width="1.6"/><path d="M882 242L892 250L902 242" fill="none" stroke="#247bff" stroke-width="1.6"/><text x="916" y="244" font-size="9.5" fill="#0f62e6" font-weight="700" letter-spacing="2.2" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">EMAIL</text><text x="916" y="265" font-size="10.5" fill="#24314a" font-weight="500" letter-spacing="0.1" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace">manashjyotibora122</text><g class="arrow"><text x="1080" y="256" font-size="15" fill="#5a6b8c" text-anchor="middle">→</text></g></g><g class="e b6"><rect x="600" y="300" width="246" height="78" rx="16" fill="#ffffff" stroke="#070b16" stroke-width="1" stroke-opacity="0.12"/><path d="M625 327H636L641 332V347H625Z" fill="none" stroke="#247bff" stroke-width="1.5"/><path d="M636 327V332H641M629 337H637M629 341H635" fill="none" stroke="#247bff" stroke-width="1.3"/><text x="656" y="334" font-size="9.5" fill="#0f62e6" font-weight="700" letter-spacing="2.2" font-family="'JetBrains Mono