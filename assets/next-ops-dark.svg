<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="520" viewBox="0 0 1180 520" role="img">
<title>Manashjyoti Bora — profile artwork</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#05080f"/>
  <stop offset="1" stop-color="#080d1a"/>
</linearGradient>
<radialGradient id="glowA" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#247bff" stop-opacity="0.3"/>
  <stop offset="1" stop-color="#247bff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowB" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#ff354f" stop-opacity="0.24"/>
  <stop offset="1" stop-color="#ff354f" stop-opacity="0"/>
</radialGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#247bff" stop-opacity="0"/>
  <stop offset=".25" stop-color="#247bff" stop-opacity=".9"/>
  <stop offset=".72" stop-color="#ff354f" stop-opacity=".9"/>
  <stop offset="1" stop-color="#ff354f" stop-opacity="0"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#f4f7ff"/>
  <stop offset=".55" stop-color="#f4f7ff"/>
  <stop offset="1" stop-color="#7fb2ff"/>
</linearGradient>
<linearGradient id="crimGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff354f"/>
  <stop offset="1" stop-color="#247bff"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="1.4" cy="1.4" r="1.3" fill="#8b9dc2" opacity="0.2"/>
</pattern>
