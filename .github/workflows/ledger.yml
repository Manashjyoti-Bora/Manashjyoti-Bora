name: ledger · commit fan
# The feather fan on the README. Pure drawing over snapshot.json - no API calls.
on:
  schedule:
    - cron: "31 1,7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 .github/scripts/ledger.py
      - run: python3 .github/scripts/state.py
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
            bash .github/scripts/commit.sh "chore(ledger): redraw the commit fan"
