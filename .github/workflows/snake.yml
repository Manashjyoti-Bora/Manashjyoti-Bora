name: snake
# Unchanged output, new home: the snake lives on the `output` branch because
# GitHub renders it from raw.githubusercontent.com and that never expires.
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Manashjyoti-Bora
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4DE1FF&color_dots=#0B1220,#123A4A,#1E6F86,#37B7D6,#5BF2B8
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
