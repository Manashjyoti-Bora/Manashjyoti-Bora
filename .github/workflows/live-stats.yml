name: Live telemetry

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: live-telemetry
  cancel-in-progress: false

jobs:
  update-live-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/live_stats.py
      - name: Commit & push refreshed widgets
        run: 'bash .github/scripts/push-safe.sh "chore: refresh live telemetry"'
