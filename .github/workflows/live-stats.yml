name: live · probe the deployments
# Two HTTPS requests per app, twelve times a day. A probe that fails is caught
# inside the script and drawn as red - the workflow itself must not go red for
# someone else's downtime.
on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python3 .github/scripts/live_stats.py || true
      - run: python3 .github/scripts/state.py || true
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
            bash .github/scripts/commit.sh "chore(live): refresh probe results" || true
