name: Daily README Self-Update

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Update README snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py

      - name: Commit & push (daily heartbeat)
        run: |
          git config user.name "Manashjyoti-Bora"
          git config user.email "manashjyotibora122@gmail.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: daily self-update $(date -u +%F)"
          git push
