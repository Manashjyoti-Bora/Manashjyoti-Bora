name: Daily README Self-Update

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: daily-self-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh README with live GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py

      - name: Commit & push (daily heartbeat)
        run: 'bash .github/scripts/push-safe.sh "chore: daily self-update $(date -u +%F)"'
