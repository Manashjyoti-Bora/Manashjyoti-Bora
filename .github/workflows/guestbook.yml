name: signature margin

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: signature-margin
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read the signatures and redraw the margin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/guestbook.py
      - name: Commit & push only if something changed
        run: 'bash .github/scripts/push-safe.sh "chore(sheet): redraw signature margin"'
