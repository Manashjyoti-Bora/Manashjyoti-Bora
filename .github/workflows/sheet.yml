name: Update blueprint sheets

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: blueprint-sheets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate test report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/testreport.py
      - name: Generate as-built log
        run: python .github/scripts/asbuilt.py
      - name: Build optional sheet
        run: '[ -f build_sheet.py ] && python build_sheet.py || true'
      - name: Commit & push sheet changes
        run: 'bash .github/scripts/push-safe.sh "chore: update blueprint sheets"'
