name: Sign the postcard wall
description: Put your name on the drawing in one line.
title: "[sign] your name"
labels: ["sign"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for stopping by. One card per GitHub account — the first one wins,
        and the wall redraws itself within six hours.
  - type: input
    id: name
    attributes:
      label: Name to print
      description: 40 characters or fewer. Your handle is printed underneath automatically.
      placeholder: Ada Lovelace
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: One line
      description: Keep it short (about 140 characters). It is printed on the card.
      placeholder: e.g. "the heartbeat wheel made me rebuild my own profile"
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I'm happy for this name and line to appear on the profile README.
          required: true
